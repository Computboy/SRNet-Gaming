project:
  name: QuickSRNet-Gaming
  scale_factor: 2

model:
  name: quicksrnet_small
  scale_factor: 2
  pretrained_checkpoint: checkpoints/pretrained/quicksrnet_small_2x_checkpoint_float32.pth.tar

data:
  train_lr: data/gaming/train/LR
  train_hr: data/gaming/train/HR
  val_lr: data/gaming/val/LR
  val_hr: data/gaming/val/HR
  scale_factor: 2
  lr_patch_size: 128
  rgb_range: [0.0, 1.0]
  augment: true
  num_workers: 0
  pin_memory: true

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  optimizer: adam
  loss: l1
  amp: true

validation:
  batch_size: 1
  metric: psnr
  save_best: true
  save_samples: true

dryrun:
  lr: data/dryrun/LR
  hr: data/dryrun/HR
  epochs: 3
  batch_size: 1
  lr_patch_size: 64
  augment: true

output:
  checkpoint_dir: checkpoints/finetuned
  log_dir: outputs/logs
  metric_dir: outputs/metrics
  sample_dir: outputs/samples

device: auto
seed: 42

notes:
  - "Initial values only; batch size will be adjusted after checking actual GPU VRAM."
  - "Do not normalize RGB to [-1,1] for QuickSRNet input; keep [0,1]."
  - "Split continuous gameplay data by complete sequence or scene, not by random frames."
