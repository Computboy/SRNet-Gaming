project:
  name: QuickSRNet-Gaming
  scale_factor: 2

data:
  lr_patch_size: 128
  hr_patch_size: 256
  rgb_range: [0.0, 1.0]

training:
  loss: L1
  optimizer: Adam
  learning_rate: 0.0001
  batch_size: 16
  max_steps: 50000
  validate_every: 1000
  save_every: 1000
  amp: true

notes:
  - "Initial values only; batch size will be adjusted after checking actual GPU VRAM."
  - "Do not normalize RGB to [-1,1] for QuickSRNet input; keep [0,1]."
