project:
  name: QuickSRNet-Gaming-Asian-Village
  scale_factor: 2

model:
  name: quicksrnet_small
  scale_factor: 2
  pretrained_checkpoint: checkpoints/pretrained/quicksrnet_small_2x_checkpoint_float32.pth.tar

data:
  train_lr: data/gaming/train/LR
  train_hr: data/gaming/train/HR
  val_lr: data/gaming/val/LR
  val_hr: data/gaming/val/HR
  scale_factor: 2
  lr_patch_size: 128
  rgb_range: [0.0, 1.0]
  augment: true
  num_workers: 4
  pin_memory: true

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  optimizer: adam
  loss: l1
  amp: true

validation:
  batch_size: 1
  metric: psnr
  save_best: true
  save_samples: true

dryrun:
  lr: data/dryrun/LR
  hr: data/dryrun/HR
  epochs: 3
  batch_size: 1
  lr_patch_size: 64
  augment: true

output:
  checkpoint_dir: checkpoints/finetuned
  log_dir: outputs/logs
  metric_dir: outputs/metrics
  sample_dir: outputs/samples

device: cuda
seed: 42

notes:
  - "Train: Scene_1_01, Scene_1_03, Scene_1_04, Scene_1_06 (960 pairs)."
  - "Validation: Scene_1_02 (240 pairs); test: Scene_1_05 (240 pairs)."
  - "Use original captured LR; synchronized 128x128 LR / 256x256 HR training crops."
  - "Validate all full-resolution frames; test is excluded from training and model selection."
  - "Preflight and pretrained validation baseline: outputs/preflight-20261018/report.json."
